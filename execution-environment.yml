# https://docs.ansible.com/projects/builder/en/latest/definition/
version: 3

images:
  base_image:
    name: registry.redhat.io/ubi8/ubi-minimal:latest
options:
    package_manager_path: /usr/bin/microdnf
dependencies:
  python_interpreter:
    package_system: python3.12
    python_path: "/usr/bin/python3"
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner
  system: files/bindep.txt
  galaxy: files/requirements.yml
  python: files/requirements.txt

additional_build_steps:
  append_base:
    - RUN $PYCMD -m pip install --upgrade pip
  append_final:
    - RUN ansible-galaxy collection install microsoft.ad
    - RUN $PKGMGR -y remove krb5-devel python3.12-devel